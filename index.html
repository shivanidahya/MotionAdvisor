<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motion to Use AI: Motion Advisor</title>
<style>
:root{--bg:#e9ecf1;--panel:#fff;--ink:#14213d;--mute:#4d5870;--line:#c5ccd9;--burg:#7a1f2b;--brass:#a97a1f;--ok:#1f6b45;--part:#8a5a00;--no:#7a1f2b;--btn:#14213d;--btnink:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--panel:#16213a;--ink:#e8ebf2;--mute:#a4aec4;--line:#2c3a5a;--burg:#e08a96;--brass:#d9aa4f;--ok:#6fd0a0;--part:#e8b85a;--no:#f0959f;--btn:#d9aa4f;--btnink:#14213d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1526;--panel:#16213a;--ink:#e8ebf2;--mute:#a4aec4;--line:#2c3a5a;--burg:#e08a96;--brass:#d9aa4f;--ok:#6fd0a0;--part:#e8b85a;--no:#f0959f;--btn:#d9aa4f;--btnink:#14213d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.serif,h1,h2,h3{font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:3px double var(--brass);padding-bottom:10px;margin-bottom:20px;font-size:14px;color:var(--mute)}
.bar b{color:var(--ink)}
.tog{display:flex;align-items:center;gap:8px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--burg)}
h1{font-size:clamp(30px,7vw,46px);line-height:1.08;margin:8px 0 12px;letter-spacing:-.01em}
h2{font-size:clamp(22px,5vw,28px);line-height:1.2;margin:0 0 10px}
h3{font-size:18px;margin:22px 0 8px}
p{margin:0 0 12px;max-width:68ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 20px;margin-bottom:16px}
.stage{font-style:italic;color:var(--mute)}
button{font:inherit;cursor:pointer;border-radius:4px;min-height:44px}
.go{background:var(--btn);color:var(--btnink);border:0;padding:10px 22px;font-weight:600}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);padding:10px 18px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.opts{display:grid;gap:10px;margin:16px 0}
.opt{text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:12px 14px}
.opt:hover{border-color:var(--brass)}
.opt[aria-pressed="true"]{border:2px solid var(--burg);background:var(--panel)}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 18px}
.prog i{display:block;height:100%;background:var(--brass);transition:width .25s}
.react{min-height:1.6em;margin:0 0 10px;color:var(--burg);font-style:italic}
details{margin:10px 0}
summary{cursor:pointer;color:var(--mute)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stamp{display:inline-block;border:4px solid currentColor;border-radius:6px;padding:6px 18px;font-family:"Palatino Linotype",Palatino,Georgia,serif;font-weight:700;font-size:clamp(26px,7vw,40px);letter-spacing:.04em;transform:rotate(-3deg);margin:6px 0 14px;animation:slam .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:rotate(-3deg) scale(2.2);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
.v-ok{color:var(--ok)}.v-part{color:var(--part)}.v-no{color:var(--no)}
.meter{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%}
.pill{font-size:13px;color:var(--mute)}
ul,ol{padding-left:22px;margin:0 0 12px}li{margin-bottom:6px;max-width:68ch}
.fine{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:12px;margin-top:20px}
[data-serious="1"] .fun{display:none}
[hidden]{display:none!important}
.recon{border:1px solid var(--brass);border-radius:6px;padding:14px 16px;margin:18px 0}
.recon label{display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer}
.recon input{width:20px;height:20px;margin-top:2px;accent-color:var(--burg);flex:none}
.tt{width:100%;border-collapse:collapse;margin:6px 0 12px}.tt td{padding:7px 4px;border-bottom:1px solid var(--line)}.tt td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.mini{font-size:24px;font-weight:700;font-family:"Palatino Linotype",Palatino,Georgia,serif}
.tok{display:inline;min-height:0;font:inherit;line-height:1.9;color:inherit;background:var(--bg);border:1px dashed var(--brass);border-radius:3px;padding:0 4px}
.tok[aria-pressed="true"]{background:#000;color:#000;border-color:#000}
.tok.miss{outline:3px solid var(--no);outline-offset:1px}.tok.over{outline:3px solid var(--part);outline-offset:1px}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:8px 14px;color:var(--mute);font-weight:600;white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.drop{border:2px dashed var(--brass);border-radius:6px;padding:16px;margin:14px 0}
.drop textarea{width:100%;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px;margin:8px 0}
.prev{max-height:220px;overflow:auto;background:var(--bg);border:1px solid var(--line);padding:10px;font-size:14px;border-radius:4px;overflow-wrap:anywhere}
mark{background:#e8c25a;color:#14213d;padding:0 2px;border-radius:2px}mark.m2{background:#e8a0a8}
.cl{list-style:none;padding:0}.cl label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.cl input{width:20px;height:20px;margin-top:2px;accent-color:var(--burg);flex:none}
.mod{border:1px solid var(--line);border-radius:6px;padding:4px 14px 10px;margin:10px 0;background:var(--panel)}.mod.hot{border:2px solid var(--brass)}
.mod summary{font-weight:600;color:var(--ink);min-height:44px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;border:1px solid var(--brass);border-radius:10px;padding:0 8px;color:var(--ink)}
.ta{width:100%;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px;margin:8px 0}
.lt{width:100%;border-collapse:collapse;font-size:14px}.lt td,.lt th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.row{display:grid;gap:10px;margin:10px 0}.row label{display:grid;gap:4px;font-size:14px}.row input,.row select{font:inherit;padding:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;min-height:40px}
fieldset{border:1px solid var(--line);border-radius:6px;margin:10px 0}
#pv{display:none}.pdoc{font-family:"Times New Roman",Georgia,serif;color:#000;line-height:1.5;font-size:12pt;white-space:pre-wrap}
@media print{body.pm main>*:not(#pv){display:none!important}body.pm #pv{display:block!important}body.pm{background:#fff}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}.prog i{transition:none}}
@media print{body{background:#fff;color:#000}.bar,.nav,.noprint,.fun{display:none!important}.card{border:0;padding:0}.stamp{animation:none}:root{--ink:#000;--mute:#333;--panel:#fff}}
</style>
</head>
<body>
<main id="app" data-serious="0">
  <div class="bar noprint">
    <span><b>Motion Advisor Portal</b> &nbsp;Case No. AI-2026-001</span>
    <label class="tog"><input type="checkbox" id="serious"> Serious mode</label>
  </div>
  <nav class="tabs noprint" id="tabs" aria-label="Portal sections"><button data-t="intake">Document intake</button><button data-t="hearing">Hearing</button><button data-t="drills">Drills</button><button data-t="training">Training</button><button data-t="toolkit">Toolkit</button></nav>
  <div id="view" aria-live="polite"></div>
  <div id="pv"></div>
</main>
<script>
const Q=[
{q:"What kind of motion is before the court?",w:1,why:"Higher stakes mean less room for a robot's creative interpretation of the law.",tip:"For substantive or dispositive motions, treat any AI output as a rough first pass and budget extra attorney review time.",o:[
 {t:"Routine or procedural (extension, scheduling, etc.)",r:0,re:"The court appreciates a low-drama docket."},
 {t:"Substantive, but not case-ending",r:1,re:"Noted. The gallery leans in."},
 {t:"Dispositive or high-stakes",r:2,re:"The gallery goes very quiet."}]},
{q:"What would the AI actually do?",w:2,why:"Formatting is low risk. Legal research and argument are where invented authority tends to appear.",tip:"Limit AI to the lower-risk tasks (formatting, outlining, summarizing material you supply). Keep legal argument and final text in your own hands.",o:[
 {t:"Formatting, proofreading, or tightening my own writing",r:0,re:"Sustained. A sensible use of a robot."},
 {t:"Summarizing public or anonymized material I provide",r:1,re:"Acceptable, with supervision."},
 {t:"Legal research or finding cases",r:2,re:"Counsel is reminded that robots have been known to invent cases."},
 {t:"Drafting the argument or final text",r:3,re:"The judge removes her glasses."}]},
{q:"What information would go into the AI tool?",w:3,why:"Confidentiality duties (Model Rule 1.6) follow client information wherever you paste it. The robot is not bound by privilege.",tip:"Anonymize or remove client-identifying and privileged details before using any AI tool, or keep that material out of the tool entirely.",o:[
 {t:"Nothing client-related, or fully anonymized",r:0,re:"Clean hands. The court is pleased."},
 {t:"Some case details, but no names or privileged material",r:2,re:"Careful. Details have a way of identifying people."},
 {t:"Confidential or privileged client information",r:3,re:"Objection! Very much objection!",stopIf:"conf"}]},
{q:"Which kind of tool is it, and do you know its data terms?",w:2,why:"Enterprise and legal-specific tools usually come with contractual data protections. Free consumer tools often do not.",tip:"Read the tool's data-retention and training terms before use, and prefer an enterprise or legal-specific tool for anything sensitive.",o:[
 {t:"Enterprise or legal-specific tool with data terms I've read",r:0,re:"A prepared attorney. Rare. Cherished."},
 {t:"Consumer tool, with privacy settings reviewed",r:1,re:"Better than nothing. The court notes the effort."},
 {t:"Consumer tool, default settings, or I'm not sure",r:3,re:"[murmuring in the gallery]",stopIf:"tool"}]},
{q:"Does your court or judge have an AI rule?",w:2,why:"Some courts and judges require disclosure or certification of AI use. Rules vary and change.",tip:"Check the local rules, the judge's standing orders, and your bar's guidance, and add any required disclosure or certification.",o:[
 {t:"Checked: no AI rule applies",r:0,re:"Diligence. The court approves."},
 {t:"Checked: disclosure is required and I'll comply",r:1,re:"Compliance noted for the record."},
 {t:"I haven't checked, or I'm not sure",r:2,re:"Counsel pleads the Fifth. Flagged."},
 {t:"A rule applies and I'd rather not follow it",r:3,re:"The bailiff steps forward.",stop:"You would be ignoring a court's AI disclosure or certification requirement."}]},
{q:"Will every citation and quotation be checked against a primary source?",w:3,why:"Unverified AI citations are the classic route to sanctions. Mata v. Avianca (S.D.N.Y. 2023) is the cautionary tale.",tip:"Pull and read every cited authority yourself in Westlaw, Lexis or the court's database, and confirm every quotation and holding before filing.",o:[
 {t:"Every one, by me or someone I supervise",r:0,re:"Trust, but verify. The court nods slowly."},
 {t:"I'll spot-check the important ones",r:2,re:"[gasp from the gallery]"},
 {t:"I'll trust it if it looks right",r:3,re:"Mata v. Avianca would like a word.",stop:"You would file without verifying the AI's citations."}]},
{q:"How well do you know this tool's limits?",w:1,why:"Competence (Model Rule 1.1) includes understanding the benefits and risks of the technology you use.",tip:"Spend time learning the tool's known limits, such as hallucinated authority and outdated law, before relying on it for filings.",o:[
 {t:"Experienced or trained, and I know its failure modes",r:0,re:"A veteran of the robot wars."},
 {t:"Some experience",r:1,re:"Learning on the job. The court is patient."},
 {t:"New to this",r:2,re:"Welcome to court. Please keep your hands on the table."}]},
{q:"How tight is the deadline?",w:1,why:"Deadline pressure is when verification gets skipped.",tip:"Build verification time into your schedule up front. If the deadline leaves no room for it, AI is the wrong shortcut.",o:[
 {t:"Plenty of time",r:0,re:"The judge raises an eyebrow in disbelief."},
 {t:"Tight, but workable",r:1,re:"A familiar story."},
 {t:"Crushing. Due in hours.",r:2,re:"[sympathetic murmurs]"}]},
{q:"Who else will use the AI on this?",w:1,why:"Supervision duties (Model Rules 5.1 and 5.3) apply to lawyers and non-lawyers who work under you.",tip:"Adopt a short written AI-use policy and make sure anyone assisting follows it and knows the verification steps.",o:[
 {t:"Just me",r:0,re:"The buck stops here."},
 {t:"Staff, under a written AI policy",r:0,re:"The court is impressed."},
 {t:"Staff, with no written policy",r:2,re:"Counsel, who is supervising whom?"}]},
{q:"Does your client know, and is billing sorted?",w:1,why:"Client communication (Model Rule 1.4) and reasonable fees (Rule 1.5) both come into play.",tip:"Consider telling the client how AI is used, and bill only for time actually spent, not for the time AI saved.",o:[
 {t:"Yes, they know and billing is handled",r:0,re:"Transparency. A stunning plot twist."},
 {t:"Not yet, but I plan to tell them",r:1,re:"The court will hold you to it."},
 {t:"No plan",r:2,re:"[the court reporter stops typing]"}]}
];
const V={ok:{cls:"v-ok",stamp:"GRANTED",line:"Proceed, counsel, with safeguards. The court expects every citation to be verified.",plain:"Lower-risk use with safeguards."},
part:{cls:"v-part",stamp:"GRANTED IN PART",line:"AI may assist with the lower-risk tasks. The legal judgment stays with you.",plain:"Limited use only."},
no:{cls:"v-no",stamp:"DENIED WITHOUT PREJUDICE",line:"Not today, counsel. Fix the items below and you may refile.",plain:"Not recommended yet."}};
const MAXR=Q.map(q=>Math.max(...q.o.map(o=>o.r)));
let i=-1,ans=[];
const $=s=>document.querySelector(s),view=$("#view"),app=$("#app");
$("#serious").onchange=e=>{app.dataset.serious=e.target.checked?"1":"0"};
function intro(){i=-1;ans=[];scan=null;pre={};tab("intake");view.innerHTML=`<div class="card"><p class="stage fun">[All rise. The Honorable Algorithm presiding.]</p>
<h1>Motion to Use AI</h1>
<p>Before you let a robot near your motion, this short hearing weighs the risks. Answer ${Q.length} questions about the motion, the tool and your safeguards. You get a ruling and a printable order with next steps.</p>
<p class="fun">Today's docket: <i>You v. Your Deadline</i>.</p>
<p class="pill">Nothing you answer is saved or sent anywhere. Don't type client details into any AI tool you haven't vetted.</p>
<div class="drop noprint" id="drop"><p><b>Document intake.</b> Upload a draft motion or your case notes (.docx, .pdf or .txt), or paste text. The portal scans it for identifying details, confidentiality markers, citations and motion type, then pre-fills the hearing.</p><input type="file" id="file" accept=".docx,.pdf,.txt,.md" aria-label="Upload a document"><textarea id="paste" rows="4" placeholder="Or paste text here" aria-label="Paste text"></textarea><button class="go" id="scanbtn">Scan document</button><p class="pill" style="margin:10px 0 0">The scan runs in your browser. Nothing is uploaded, sent to an AI model, or stored.</p></div><div id="scanout"></div><div class="nav" style="justify-content:flex-start"><button class="ghost" id="start">Start without a document</button><button class="ghost" id="drill">Practice drills</button></div>
<p class="fine">Decision support only. This is not legal advice and creates no attorney-client relationship. You remain counsel of record and responsible for every filing.</p></div>`;
$("#start").onclick=()=>{i=0;ask()};$("#drill").onclick=drillMenu;wireIntake()}
function ask(){tab("hearing");const q=Q[i],sel=ans[i];
view.innerHTML=`<div class="card"><div class="pill">Question ${i+1} of ${Q.length}</div><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${Q.length}" aria-valuenow="${i+1}"><i style="width:${(i+1)/Q.length*100}%"></i></div>
<h2>${q.q}</h2>${pre[i]?'<p class="pill">Suggested from your document scan. Change it if it is wrong.</p>':""}
<div class="opts">${q.o.map((o,k)=>`<button class="opt" aria-pressed="${sel===k}" data-k="${k}">${o.t}</button>`).join("")}</div>
<p class="react fun" id="react">${sel!=null?q.o[sel].re:""}</p>
<details><summary>Sidebar: why we ask</summary><p>${q.why}</p></details>
<div class="nav"><button class="ghost" id="back">${i?"Back":"Home"}</button><button class="go" id="next" ${sel==null?"disabled":""}>${i==Q.length-1?"Hear the ruling":"Next question"}</button></div></div>`;
view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;delete pre[i];ask();$(".opt[aria-pressed=true]").focus()});
$("#back").onclick=()=>i?(i--,ask()):intro();
$("#next").onclick=()=>{if(ans[i]==null)return;if(i==Q.length-1)verdict();else{i++;ask()}}}
function verdict(){tab("hearing");
let score=0,max=0,rows=[],flags={},stops=[];
Q.forEach((q,k)=>{const o=q.o[ans[k]],p=q.w*o.r;score+=p;max+=q.w*MAXR[k];rows.push({q,o,p});
 if(o.stopIf)flags[o.stopIf]=1;if(o.stop)stops.push(o.stop)});
if(flags.conf&&flags.tool)stops.push("Confidential client information would go into a tool with unknown or weak data protections.");
const pct=Math.round(score/max*100);
const key=stops.length||pct>=55?"no":pct>=28?"part":"ok",v=V[key];
const drivers=rows.filter(r=>r.p>0).sort((a,b)=>b.p-a.p).slice(0,3);
const steps=rows.filter(r=>r.p>0).sort((a,b)=>b.p-a.p).map(r=>r.q.tip);
const col={ok:"var(--ok)",part:"var(--part)",no:"var(--no)"}[key];
view.innerHTML=`<div class="card" id="order">
<p class="stage fun">[The judge raises the gavel. Silence.]</p>
<h2 class="serif">Order on Motion to Use AI</h2>
<p class="pill">Case No. AI-2026-001 &middot; ${new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})}</p>
<div class="stamp ${v.cls}" role="status">${v.stamp}</div>
<p class="serif" style="font-size:19px">${v.line}</p>
<p><b>Overall risk reading:</b> ${pct}% (${v.plain})</p>
<div class="meter" aria-hidden="true"><i style="width:${Math.max(pct,4)}%;background:${col}"></i></div>
${stops.length?`<h3>Hard stop${stops.length>1?"s":""}</h3><p>The court denies the motion regardless of score because:</p><ul>${stops.map(s=>`<li>${s}</li>`).join("")}</ul>`:""}
<h3>Findings of fact</h3>
${drivers.length?`<p>These answers weighed most heavily:</p><ul>${drivers.map(r=>`<li><b>${r.q.q}</b> You answered: ${r.o.t}.</li>`).join("")}</ul>`:"<p>No answers raised meaningful concern.</p>"}
<h3>Conditions of the order</h3>
<ul class="cl" id="cl">${[...(steps.length?steps:["Keep doing what you're doing, and keep a short log of how AI was used."]),"Read every line of the final draft yourself. AI does not replace legal review."].map(s=>`<li><label><input type="checkbox"><span>${s}</span></label></li>`).join("")}
</ul><p class="pill noprint" id="clp">0 conditions met</p>
<h3>Rules the court suggests you read</h3>
<ul><li>ABA Formal Opinion 512 (2024) on generative AI</li><li>Model Rules 1.1, 1.4, 1.5, 1.6, 3.3, 5.1 and 5.3, and your state's version of them</li><li>Your court's local rules and the judge's standing orders</li></ul>
<p class="fine">Decision support only, not legal advice, and no attorney-client relationship is created. Verify all rules directly, since they change often. <span class="fun">Any resemblance to an actual courtroom comedy is intentional.</span></p>
${extras()}<div class="nav noprint"><button class="ghost" id="redo">Refile with a new motion</button><button class="ghost" id="totrain">Get trained on these gaps</button><button class="go" id="print">Print or save the order as PDF</button></div></div>`;
$("#redo").onclick=intro;$("#print").onclick=()=>window.print();wire();window.scrollTo(0,0)}
const TASKS=["Formatting or proofreading","Summarizing material I supply","Legal research","Drafting the argument or final text"];
const SH={ok:["Granted","v-ok"],part:["Granted in part","v-part"],no:["Denied","v-no"]};
function calc(a){let s=0,m=0,f={},st=0;Q.forEach((q,k)=>{const o=q.o[a[k]];s+=q.w*o.r;m+=q.w*MAXR[k];if(o.stopIf)f[o.stopIf]=1;if(o.stop)st++});if(f.conf&&f.tool)st++;const pct=Math.round(s/m*100);return{pct,st,key:st||pct>=55?"no":pct>=28?"part":"ok"}}
function taskTable(a){return'<table class="tt">'+TASKS.map((t,x)=>{const b=a.slice();b[1]=x;const k=calc(b).key;return`<tr><td>${t}</td><td class="${SH[k][1]}">${SH[k][0]}</td></tr>`}).join("")+'</table>'}
const best=k=>Q[k].o.findIndex(o=>o.r==0&&!o.stop&&!o.stopIf);
function extras(){const ks=Q.map((_,k)=>k).filter(k=>k!=1&&Q[k].o[ans[k]].r>0&&best(k)>=0).sort((a,b)=>Q[b].w*Q[b].o[ans[b]].r-Q[a].w*Q[a].o[ans[a]].r);

function gen(){tab("toolkit");view.innerHTML=`<div class="card"><h2>Policy and engagement-letter generator</h2><p>Answer a few questions, edit the drafts, then check them against your own rules and judgment.</p><div class="row"><label>Firm name<input id="fn"></label><label>Attorney name<input id="fa"></label><label>Client name (stays in your browser)<input id="fcl"></label><label>Matter description<input id="fm" placeholder="e.g. a contract dispute"></label><label>Approved AI tools (comma-separated)<input id="ft"></label><label>Billing model<select id="fb"><option value="h">Hourly</option><option value="f">Flat fee</option></select></label><label>Policy review schedule<input id="fd" placeholder="e.g. every six months"></label></div><fieldset><legend>Allowed tasks</legend>${["Formatting and proofreading","Summarizing material I supply","Outlining and brainstorming","Research, with every result verified","First-draft sections, with full attorney review"].map((x,k)=>`<label style="display:flex;gap:8px;margin:6px 0"><input type="checkbox" class="tk" value="${x}"${k<3?" checked":""}> ${x}</label>`).join("")}</fieldset><label style="display:flex;gap:8px;margin:10px 0"><input type="checkbox" id="fc"> Our courts or judges require AI disclosure</label><button class="go" id="mk">Generate drafts</button><div id="gout"></div>${bkb()}</div>`;$("#bk").onclick=toolkit;
$("#mk").onclick=()=>{const at=$("#fa").value.trim()||"[Attorney name]",cl=$("#fcl").value.trim()||"[Client name]",mt=$("#fm").value.trim()||"[describe the matter]",f=$("#fn").value.trim()||"[Firm name]",tl=$("#ft").value.trim()||"[list approved tools]",tk=[...document.querySelectorAll(".tk:checked")].map(x=>x.value),h=$("#fb").value=="h",dc=$("#fc").checked,rv=$("#fd").value.trim()||"every six months";
const P=`${f.toUpperCase()}: GENERATIVE AI USE POLICY\n\n1. Approved tools. Only these tools may be used for client work: ${tl}. No other AI tool may be used.\n\n2. Allowed tasks. ${tk.length?tk.join("; "):"[none selected]"}. Everything else is prohibited without a supervising attorney's approval.\n\n3. Data. Never enter client names, privileged material or other confidential information unless the tool has contractual confidentiality protections and any required client consent is on file. Anonymize inputs by default.\n\n4. Verification. A lawyer must pull and read every citation and check every quotation against a primary source before anything is filed or sent.\n\n5. Disclosure. ${dc?"Check each court's rules and the assigned judge's standing orders and make any required disclosure or certification.":"Before each filing, check the court's rules and the judge's standing orders for any AI disclosure or certification requirement."}\n\n6. Supervision. The supervising attorney reviews all AI-assisted work and trains staff on this policy.\n\n7. Logging. Record each AI-assisted task and its verification in the AI use log.\n\n8. Incidents. If confidential information is entered by mistake or an unverified citation is filed, stop, tell the supervising attorney immediately, and follow the firm's incident steps.\n\n9. Review. This policy is reviewed ${rv}. Everyone who works on client matters must read and sign it.`;
const C=`USE OF GENERATIVE AI\n\nWe may use generative artificial intelligence tools to assist with tasks such as ${tk.length?tk.join(", ").toLowerCase():"[tasks]"}. We will not enter your confidential information into an AI tool unless it provides contractual confidentiality protections and, where required, you have given informed consent. A lawyer will review all AI-assisted work and verify every legal citation before it is delivered or filed. ${dc?"If a court requires disclosure of AI use in a filing, we will make it. ":""}${h?"You will be billed only for the time we actually spend, including time spent reviewing and verifying AI-assisted work. You will not be billed for time that AI saves. General AI subscription costs are part of our overhead and will not be charged to you unless we agree in writing.":"Our flat fee reflects the reasonable value of the work, including any efficiency from our tools. General AI subscription costs are part of our overhead."} If you prefer that we not use AI on your matter, tell us in writing.`;
const LT=`${f}\n\n[Date]\n\n${cl}\n\nRe: Engagement for ${mt}\n\nDear ${cl}:\n\nThank you for choosing ${f}. This letter sets out the terms of our representation.\n\n1. Scope. We will represent you in ${mt}. Anything outside this scope requires a separate written agreement.\n\n2. Fees and costs. ${h?"Our fees are billed hourly at [rate] per hour for attorneys and [rate] per hour for staff. [Retainer, if any.]":"Our fee for this matter is a flat fee of [amount]. [Payment schedule.]"} You will also be responsible for court costs and other expenses as described in our fee policy. [Add your standard fee, retainer and trust-account terms.]\n\n3. ${C}\n\n4. Communication. We will keep you informed of significant developments and respond to your questions promptly.\n\n5. Termination. You may end our representation at any time. We may withdraw as permitted by the rules of professional conduct.\n\nIf these terms are acceptable, please sign and return a copy of this letter.\n\nSincerely,\n\n\n______________________\n${at}\n${f}\n\nAGREED AND ACCEPTED:\n\n\n______________________\n${cl}          Date: ____________`;
$("#gout").innerHTML=`<h3>AI use policy</h3><textarea class="ta" id="p1" rows="12" aria-label="Policy draft">${E(P)}</textarea><button class="ghost" id="b1">Copy policy</button> <button class="go" id="d1">Download PDF</button> <button class="ghost" id="w1">Download Word</button><h3>Engagement letter</h3><textarea class="ta" id="p2" rows="16" aria-label="Engagement letter draft">${E(LT)}</textarea><button class="ghost" id="b2">Copy letter</button> <button class="go" id="d2">Download PDF</button> <button class="ghost" id="w2">Download Word</button><p class="pill">Starting drafts only. Not legal advice. Edit the text first. The PDF and Word files use whatever is in the box, in 11-point Arial with the numbered headings in bold. Add your own standard terms to the letter.</p>`;
$("#b1").onclick=e=>cp("#p1",e.target);$("#b2").onclick=e=>cp("#p2",e.target);const pr=id=>{$("#pv").innerHTML='<div class="pdoc">'+E($(id).value)+'</div>';document.body.classList.add("pm");window.print();setTimeout(()=>document.body.classList.remove("pm"),1000)};
const SG=(l,k)=>{if(!l.trim())return[];if(k==0||/^(Re:|AGREED AND ACCEPTED:)/.test(l)||/^\d+\.\s[A-Z][A-Z ]+$/.test(l))return[[l,1]];const m=l.match(/^(\d+\.\s[^.]+\.)(.*)$/);return m?[[m[1],1],[m[2],0]]:[[l,0]]};
const sv=async(data,name,btn)=>{try{const dls=window.claude&&await claude.use("downloads");if(dls){await dls.save({filename:name,data})}else{const a=document.createElement("a");a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=name;document.body.append(a);a.click();a.remove()}btn.textContent="Saved"}catch(e){btn.textContent=e&&e.code=="declined"?"Download cancelled":"Couldn't save the file."}};
const dl=async(id,name,btn)=>{try{await load("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");const d=new jspdf.jsPDF({unit:"pt",format:"letter"});d.setFontSize(11);d.setFont("helvetica","normal");const sp=d.getTextWidth(" ");let y=72,x=72;
$(id).value.split("\n").forEach((l,k)=>{const s=SG(l,k);x=72;if(!s.length){y+=15;return}s.forEach(([t,b])=>{d.setFont("helvetica",b?"bold":"normal");t.split(/\s+/).filter(Boolean).forEach(w=>{const ww=d.getTextWidth(w);if(x+ww>540){x=72;y+=15}if(y>720){d.addPage();y=72}d.text(w,x,y);x+=ww+sp})});y+=15});
await sv(d.output("arraybuffer"),name,btn)}catch(e){btn.textContent="Couldn't create the PDF."}};
const dw=async(id,name,btn)=>{try{await load("https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js");const D=window.docx,P=$(id).value.split("\n").map((l,k)=>new D.Paragraph({children:SG(l,k).map(([t,b])=>new D.TextRun({text:t,bold:!!b}))}));const doc=new D.Document({styles:{default:{document:{run:{font:"Arial",size:22}}}},sections:[{properties:{page:{size:{width:12240,height:15840},margin:{top:1440,right:1440,bottom:1440,left:1440}}},children:P}]});await sv(await D.Packer.toBlob(doc),name,btn)}catch(e){btn.textContent="Couldn't create the Word file."}};
$("#d1").onclick=e=>dl("#p1","AI-use-policy.pdf",e.target);$("#w1").onclick=e=>dw("#p1","AI-use-policy.docx",e.target);$("#d2").onclick=e=>dl("#p2","Engagement-letter.pdf",e.target);$("#w2").onclick=e=>dw("#p2","Engagement-letter.docx",e.target)}}
function ulog(){tab("toolkit");let L=[];try{L=JSON.parse(localStorage.getItem("mtu_log")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("mtu_log",JSON.stringify(L))}catch(e){}};
const draw=()=>{const csv="date,matter,tool,task,minutes,checks,notes\n"+L.map(e=>[e.d,e.m,e.t,e.k,e.r,e.v.filter(Boolean).length,e.n].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n");
view.innerHTML=`<div class="card"><h2>AI use log</h2><p>One row per AI-assisted task. Use a matter number, never a client name. The log stays in this browser only.</p><div class="row"><label>Date<input id="ld" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Matter number<input id="lm"></label><label>Tool<input id="lt"></label><label>Task<select id="lk"><option>Formatting or proofreading</option><option>Summarizing</option><option>Research</option><option>Drafting</option><option>Other</option></select></label><label>Minutes spent reviewing<input id="lr" type="number" min="0"></label><label>Notes<input id="ln"></label></div>${["Citations verified","Read in full","Details anonymized"].map(x=>`<label style="display:flex;gap:8px;margin:6px 0"><input type="checkbox" class="lv"> ${x}</label>`).join("")}<button class="go" id="la">Add entry</button>${L.length?`<div style="overflow-x:auto;margin-top:14px"><table class="lt"><tr><th>Date</th><th>Matter</th><th>Tool</th><th>Task</th><th>Min</th><th>Checks</th><th>Notes</th></tr>${L.map(e=>`<tr><td>${E(e.d)}</td><td>${E(e.m)}</td><td>${E(e.t)}</td><td>${E(e.k)}</td><td>${E(e.r)}</td><td>${e.v.filter(Boolean).length}/3</td><td>${E(e.n)}</td></tr>`).join("")}</table></div><textarea class="ta" id="csv" rows="4" readonly aria-label="Log as CSV">${E(csv)}</textarea><button class="ghost" id="lc">Copy as CSV</button> <button class="ghost" id="lx">Clear log</button>`:"<p class='pill'>No entries yet.</p>"}${bkb()}</div>`;
$("#bk").onclick=toolkit;$("#la").onclick=()=>{L.push({d:$("#ld").value,m:$("#lm").value,t:$("#lt").value,k:$("#lk").value,r:$("#lr").value,n:$("#ln").value,v:[...document.querySelectorAll(".lv")].map(c=>c.checked)});save();draw()};
if(L.length){$("#lc").onclick=e=>cp("#csv",e.target);$("#lx").onclick=()=>{L=[];save();draw()}}};draw()}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>({intake:intro,hearing:()=>{i=0;ask()},drills:drillMenu,training:training,toolkit:toolkit})[b.dataset.t]());
intro();
</script>
